<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pr-brief open graph image</title>
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 600; font-display: swap; src: url("fonts/space-grotesk-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: swap; src: url("fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "DM Mono"; font-weight: 400; font-display: swap; src: url("fonts/dm-mono-latin-400-normal.woff2") format("woff2"); }
/* rendered at 2x: the PNG is twice the CSS size below */
html { zoom: 2; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1200px; height: 630px; background: #fff; color: #0b0b0b; font-family: "Space Grotesk", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; position: relative; }
.top { height: 14px; background: linear-gradient(90deg, #00a86b 0 200px, #0b0b0b 200px); }
.mast { margin: 34px 64px 0; padding-bottom: 12px; border-bottom: 6px double #0b0b0b; display: flex; justify-content: space-between; align-items: baseline; font-family: "DM Mono", monospace; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #4a4a4a; }
h1 { margin: 34px 64px 0; font-weight: 700; font-size: 124px; line-height: 1; letter-spacing: -.04em; }
.pitch { margin: 14px 64px 0; font-weight: 600; font-size: 38px; letter-spacing: -.01em; }
.strip { position: absolute; left: 64px; right: 64px; bottom: 74px; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 5px solid #0b0b0b; border-bottom: 5px solid #0b0b0b; }
.st { position: relative; padding: 16px 0 16px 28px; }
.st + .st { border-left: 1px solid #0b0b0b; padding-left: 54px; }
.st small { display: block; font-family: "DM Mono", monospace; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: #006e47; margin-bottom: 4px; }
.st b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
.st + .st::before { content: ""; position: absolute; left: -26px; top: 50%; width: 48px; height: 7px; margin-top: -3px; background: #00a86b; }
.st + .st::after { content: ""; position: absolute; left: 6px; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -4px; border-top: 7px solid #00a86b; border-right: 7px solid #00a86b; transform: rotate(45deg); }
.url { position: absolute; left: 64px; bottom: 28px; font-family: "DM Mono", monospace; font-size: 16px; color: #4a4a4a; }
</style>
</head>
<body>
<div class="top"></div>
<div class="mast"><span>Claude Code plugin &middot; GitHub Action &middot; Go CLI</span><span>Briefing sheet</span></div>
<h1>pr-brief</h1>
<div class="pitch">PR descriptions a reviewer can read.</div>
<div class="strip"><div class="st"><small>Input</small><b>Input 1</b></div><div class="st"><small>Functions</small><b>Changed code</b></div><div class="st"><small>Output</small><b>Output 1</b></div></div>
<div class="url">gagoar.github.io/pr-brief</div>
</body>
</html>
