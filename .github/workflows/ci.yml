name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Zero third-party modules
        run: |
          if grep -q '^require' go.mod; then echo "go.mod must have no requires" >&2; exit 1; fi

  # The binaries are not in git: the release workflow builds them. This job proves that every
  # target still compiles, so a release cannot fail on a build error.
  build-all-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Build every binary
        run: ./build.sh
      - name: No binary may be tracked by git
        run: |
          if git ls-files plugin/bin bin | grep -q 'pr-brief-'; then
            echo "A binary is committed. Remove it: binaries are built by the release workflow." >&2
            git ls-files plugin/bin bin | grep 'pr-brief-' >&2
            exit 1
          fi
