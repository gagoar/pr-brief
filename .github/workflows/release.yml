# When a v*.*.* tag is pushed: check the committed binaries against a fresh build,
# publish them with SHA256SUMS, and attest where they came from. No personal access
# token: the job uses its own token and OIDC. Actions are pinned to full commit SHAs.
name: release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: The committed binaries must equal a fresh build
        run: |
          ./build.sh
          git diff --exit-code --stat -- bin/
      - name: Checksums
        run: |
          cd bin
          sha256sum pr-brief-* > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'bin/pr-brief-*'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Binaries are attested. Check them against SHA256SUMS."
          gh release upload "$GITHUB_REF_NAME" bin/pr-brief-* SHA256SUMS --clobber
