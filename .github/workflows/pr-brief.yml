# This repo uses its own gate. Copy this file to use it in another repo, with
# `uses: gagoar/pr-brief@v0` in place of `uses: ./`.
#
# The checkout is the BASE commit, not the PR's merge commit. The gate reads
# .pr-brief.json from the checkout, and a PR must not be able to edit its own rules.
# This is safe: the gate only reads the config and the event payload, and never
# runs code from the PR.
name: pr-brief
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  description:
    # Draft PRs may still be a work in progress.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./
